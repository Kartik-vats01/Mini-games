<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stone Paper Scissor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="paper.css">
</head>
<body>

<div class="Game pb-5">
    <div class="container text-center mt-5 px-3">

        <h1>Stone Paper Scissor</h1>
        <p class="lead">Pick your move and win the match against the computer.</p>

        <div id="matchSelect" class="mt-4 card shadow-sm p-4 choice-panel">
            <h2 class="mb-3">Choose match length</h2>
            <div class="d-flex justify-content-center flex-wrap">
                <button class="btn choice-btn m-2" onclick="startMatch(3)">Best of 3</button>
                <button class="btn choice-btn m-2" onclick="startMatch(5)">Best of 5</button>
                <button class="btn choice-btn m-2" onclick="startMatch(7)">Best of 7</button>
            </div>
        </div>

        <div id="gameArea" class="mt-4" style="display:none;">
            <div class="match-status card shadow-sm p-4">
                <div class="row gy-3">
                    <div class="col-md-6">
                        <p class="status-label">Target wins</p>
                        <p id="targetScore" class="status-value">0</p>
                    </div>
                    <div class="col-md-6">
                        <p class="status-label">Rounds played</p>
                        <p id="roundInfo" class="status-value">0</p>
                    </div>
                </div>
            </div>

            <div class="gameblock mt-4 card shadow-sm p-4">
                <p class="mb-3">Choose your move:</p>
                <button class="bt1 btn m-2" data-choice="Stone">Stone</button>
                <button class="bt1 btn m-2" data-choice="Paper">Paper</button>
                <button class="bt1 btn m-2" data-choice="Scissor">Scissor</button>
            </div>

            <div class="choice-display mt-4 row gx-3">
                <div class="choice-card col-md-6 card p-4 shadow-sm">
                    <p>You chose</p>
                    <strong id="userChoice">-</strong>
                </div>
                <div class="choice-card col-md-6 card p-4 shadow-sm">
                    <p>Computer chose</p>
                    <strong id="computerChoice">-</strong>
                </div>
            </div>

            <h2 id="result" class="mt-4 result-box"></h2>

            <div class="score mt-4 row gx-3">
                <div class="score-card col-md-6 card p-4 shadow-sm">
                    <h3>User</h3>
                    <p id="userScore">0</p>
                </div>
                <div class="score-card col-md-6 card p-4 shadow-sm">
                    <h3>Computer</h3>
                    <p id="compScore">0</p>
                </div>
            </div>

            <div class="d-flex justify-content-center flex-wrap gap-3 mt-4">
                <button id="resetBtn" class="btn btn-warning">Reset Score</button>
                <button class="btn btn-secondary" onclick="newMatch()">Change Match</button>
            </div>
        </div>

        <div id="winnerScreen" class="mt-4 card shadow-sm p-5" style="display:none;">
            <h1 id="winnerText"></h1>
            <button class="btn btn-success mt-3" onclick="newMatch()">New Match</button>
        </div>

    </div>
</div>

<script src="scissor.js"></script>
</body>
</html>
